<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azyvion CRM</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #1a1a2e;
            --card: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.55);
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --field-bg: rgba(118, 118, 128, 0.12);
            --field-focus: rgba(10, 132, 255, 0.14);
            --accent: #0A84FF;
            --accent-dark: #0060DF;
            --danger: #FF453A;
            --divider: rgba(60, 60, 67, 0.13);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            overflow: hidden;
            position: relative;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            animation: drift linear infinite;
            pointer-events: none;
        }

        .bg-orb:nth-child(1) {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #0A84FF 0%, #005cc5 100%);
            top: -120px;
            left: -80px;
            animation-duration: 18s;
        }

        .bg-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #5e5ce6 0%, #1c1c8a 100%);
            bottom: -100px;
            right: -60px;
            animation-duration: 22s;
            animation-direction: reverse;
        }

        .bg-orb:nth-child(3) {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #30d158 0%, #1a7a35 100%);
            bottom: 100px;
            left: 60px;
            animation-duration: 28s;
            opacity: 0.3;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(40px, 30px) scale(1.06);
            }

            66% {
                transform: translate(-20px, 50px) scale(0.95);
            }

            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 360px;
            margin: 24px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px 32px 36px;
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            box-shadow: 0 2px 0 rgba(255, 255, 255, 0.6) inset, 0 32px 80px rgba(0, 0, 0, 0.38), 0 8px 24px rgba(0, 0, 0, 0.22);
            animation: cardIn 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #0A84FF 0%, #005cc5 100%);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 6px 22px rgba(10, 132, 255, 0.38);
        }

        .brand-icon svg {
            width: 34px;
            height: 34px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.4px;
        }

        .brand-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 400;
        }

        .field-group {
            background: var(--field-bg);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .field {
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 52px;
            position: relative;
            transition: background .18s;
        }

        .field:first-child:not(:last-child) {
            border-bottom: 1px solid var(--divider);
        }

        .field:focus-within {
            background: var(--field-focus);
        }

        .field-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: var(--text-secondary);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            margin-right: 11px;
            transition: stroke .18s;
        }

        .field:focus-within .field-icon {
            stroke: var(--accent);
        }

        .field input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-primary);
            caret-color: var(--accent);
        }

        .field input::placeholder {
            color: var(--text-secondary);
        }

        .field-action {
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            transition: color .18s;
        }

        .field-action:hover {
            color: var(--accent);
        }

        .field-action svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .error-msg {
            font-size: 13px;
            color: var(--danger);
            margin-bottom: 12px;
            display: none;
            background: rgba(255, 69, 58, 0.08);
            border-radius: 10px;
            padding: 9px 13px;
        }

        .error-msg.visible {
            display: block;
        }

        .row-aux {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            font-size: 13.5px;
            color: var(--text-secondary);
            user-select: none;
        }

        .checkbox-label input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .custom-check {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 1.5px solid rgba(60, 60, 67, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, border-color .15s;
            flex-shrink: 0;
        }

        .checkbox-label input:checked~.custom-check {
            background: var(--accent);
            border-color: var(--accent);
        }

        .custom-check svg {
            width: 10px;
            height: 10px;
            stroke: #fff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            opacity: 0;
            transition: opacity .15s;
        }

        .checkbox-label input:checked~.custom-check svg {
            opacity: 1;
        }

        .link {
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: 13.5px;
            color: var(--accent);
            cursor: pointer;
            font-weight: 500;
        }

        .link:hover {
            color: var(--accent-dark);
        }

        .btn-primary {
            width: 100%;
            height: 52px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background .2s;
            margin-bottom: 20px;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-dark);
        }

        .btn-primary:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .btn-text {
            transition: opacity .2s;
        }

        .spinner {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .spinner::after {
            content: '';
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .btn-primary.loading .btn-text {
            opacity: 0;
        }

        .btn-primary.loading .spinner {
            display: flex;
        }

        .footer-text {
            text-align: center;
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .toast {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: rgba(30, 30, 30, 0.92);
            color: #fff;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            transition: transform .38s cubic-bezier(0.34, 1.42, 0.64, 1);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        @media(prefers-reduced-motion:reduce) {

            .bg-orb,
            .card {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>

    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" style="stroke:#30d158">
            <polyline points="20 6 9 17 4 12" />
        </svg>
        Sesión iniciada correctamente
    </div>

    <div class="card">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5" />
                    <path d="M2 12l10 5 10-5" />
                </svg>
            </div>
            <div class="brand-name">Azyvion CRM</div>
            <div class="brand-sub">Technology Beyond Limits</div>
        </div>

        <div class="field-group">
            <div class="field">
                <svg class="field-icon" viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <input type="text" id="usuario" placeholder="Usuario" autocomplete="username" />
            </div>
            <div class="field">
                <svg class="field-icon" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" />
                <button class="field-action" onclick="togglePwd()" aria-label="Mostrar contraseña">
                    <svg id="eyeIcon" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="error-msg" id="errMsg">Usuario o contraseña incorrectos.</div>

        <div class="row-aux">
            <label class="checkbox-label">
                <input type="checkbox" id="remember" />
                <span class="custom-check">
                    <svg viewBox="0 0 12 12">
                        <polyline points="2 6 5 9 10 3" />
                    </svg>
                </span>
                Recordarme
            </label>
            <button class="link" onclick="handleForgot()">¿Olvidaste tu contraseña?</button>
        </div>

        <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
            <span class="btn-text">Iniciar sesión</span>
            <div class="spinner"></div>
        </button>

        <p class="footer-text">
            Al ingresar aceptas los <a class="link" href="#">Términos de uso</a> de Azyvion.
        </p>
    </div>

    <!-- ════════════════════════════════════════════════════════════
         AZYVION · PUENTE API  (google.script.run  ->  fetch GET)
         Necesario SOLO cuando el HTML se sirve fuera de Apps Script
         (GitHub Pages, Netlify, etc.). Debe ir ANTES del script principal.
    ═════════════════════════════════════════════════════════════ -->
    <script>
    /* ════════════════════════════════════════════════════════════
       AZYVION · PUENTE API v4 — Sesiones reales con token seguro
       ════════════════════════════════════════════════════════════
       ⚠️  REEMPLAZA ESTA URL CON LA URL DE TU WEB APP ACTUAL
    ════════════════════════════════════════════════════════════ */
    (function () {
        const API_URL = 'https://script.google.com/macros/s/AKfycbxmYsm-d6XB6aWSV_U84cGINQOpMyY8eqf87t6XAaV0OYrjmqUvUtZHl1c4lw5vlz0U/exec';
        const SESSION_KEY = 'azyvion_session';

        // Duración máxima de sesión "Recordarme" en ms (30 días)
        const REMEMBER_DURATION = 30 * 24 * 60 * 60 * 1000;

        const MAP = {
            login:            (u, p, r) => ({ action: 'login', usuario: u, contrasena: p, remember: r ? 'true' : 'false' }),
            logout:           ()        => ({ action: 'logout' }),
            checkSession:     ()        => ({ action: 'checkSession' }),
            getResumen:       ()        => ({ action: 'getResumen' }),
            getActividad:     (n)       => ({ action: 'getActividad', limit: n || 10 }),
            getClientes:      ()        => ({ action: 'getClientes' }),
            addCliente:       (d)       => Object.assign({ action: 'addCliente' }, d),
            updateCliente:    (id, d)   => Object.assign({ action: 'updateCliente', id: id }, d),
            deleteCliente:    (id)      => ({ action: 'deleteCliente', id: id }),
            getProspectos:    ()        => ({ action: 'getProspectos' }),
            addProspecto:     (d)       => Object.assign({ action: 'addProspecto' }, d),
            updateProspecto:  (id, d)   => Object.assign({ action: 'updateProspecto', id: id }, d),
            deleteProspecto:  (id)      => ({ action: 'deleteProspecto', id: id }),
            convertirProspecto:(id,d)   => Object.assign({ action: 'convertirProspecto', id: id }, d || {}),
            getInventario:    ()        => ({ action: 'getInventario' }),
            addInventario:    (d)       => Object.assign({ action: 'addInventario' }, d),
            updateInventario: (id, d)   => Object.assign({ action: 'updateInventario', id: id }, d),
            deleteInventario: (id)      => ({ action: 'deleteInventario', id: id }),
            getEncuestas:     ()        => ({ action: 'getEncuestas' }),
            addEncuesta:      (d)       => Object.assign({ action: 'addEncuesta' }, d),
            updateEncuesta:   (id, d)   => Object.assign({ action: 'updateEncuesta', id: id }, d),
            deleteEncuesta:   (id)      => ({ action: 'deleteEncuesta', id: id }),
            getUsuarios:      ()        => ({ action: 'getUsuarios' }),
            addUsuario:       (d)       => Object.assign({ action: 'addUsuario' }, d),
            updateUsuario:    (id, d)   => Object.assign({ action: 'updateUsuario', id: id }, d),
            deleteUsuario:    (id)      => ({ action: 'deleteUsuario', id: id })
        };

        function readSession() {
            try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
        }

        function getToken() {
            const s = readSession();
            return s ? s.token : null;
        }

        function call(name, args, onSuccess, onFailure) {
            const params = MAP[name].apply(null, args);

            // Adjuntar token en todas las peticiones que no sean login
            if (name !== 'login') {
                const token = getToken();
                if (token) params.token = token;
            }

            const qs = new URLSearchParams();
            Object.keys(params).forEach(function (k) {
                const val = params[k];
                if (val !== undefined && val !== null) qs.append(k, val);
            });

            fetch(API_URL + '?' + qs.toString(), { method: 'GET', redirect: 'follow' })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function (txt) {
                    let data;
                    try {
                        data = JSON.parse(txt);
                    } catch (e) {
                        throw new Error('El Web App no devolvió JSON. Verifica que esté publicado como "Cualquier persona".');
                    }

                    if (name === 'login' && data.ok) {
                        // Guardar sesión: NUNCA la contraseña, solo el token del servidor
                        const sess = {
                            token:  data.token,
                            nombre: data.nombre,
                            rol:    data.rol,
                            expira: data.expira
                        };
                        localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
                    }

                    if (name === 'logout') {
                        localStorage.removeItem(SESSION_KEY);
                    }

                    // Si el servidor dice que la sesión es inválida, limpiar localStorage
                    if (data && data.ok === false && data.error &&
                        data.error.includes('Sesión inválida')) {
                        localStorage.removeItem(SESSION_KEY);
                    }

                    if (onSuccess) onSuccess(data);
                })
                .catch(function (err) {
                    console.error('[Azyvion API]', name, err);
                    if (onFailure) onFailure(err);
                });
        }

        function makeRunner(onSuccess, onFailure) {
            const runner = {
                withSuccessHandler: function (fn) { return makeRunner(fn, onFailure); },
                withFailureHandler: function (fn) { return makeRunner(onSuccess, fn); }
            };
            Object.keys(MAP).forEach(function (name) {
                runner[name] = function () { call(name, Array.from(arguments), onSuccess, onFailure); };
            });
            return runner;
        }

        window.google = window.google || {};
        window.google.script = window.google.script || {};
        window.google.script.run = makeRunner(null, null);
    })();
    </script>
    <script>
        /* ---------- Toggle contraseña ---------- */
        let pwdVisible = false;
        function togglePwd() {
            pwdVisible = !pwdVisible;
            document.getElementById('password').type = pwdVisible ? 'text' : 'password';
            document.getElementById('eyeIcon').innerHTML = pwdVisible
                ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
           <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
           <line x1="1" y1="1" x2="23" y2="23"/>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        }

        /* ---------- Login con GAS ---------- */
        function handleLogin() {
            const usuario   = document.getElementById('usuario').value.trim();
            const pwd       = document.getElementById('password').value;
            const remember  = document.getElementById('remember').checked;
            const btn       = document.getElementById('loginBtn');
            const err       = document.getElementById('errMsg');

            err.classList.remove('visible');

            if (!usuario || !pwd) {
                err.textContent = 'Ingresa tu usuario y contraseña.';
                err.classList.add('visible');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            google.script.run
                .withSuccessHandler(function (res) {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    if (res.ok) {
                        // "Recordarme": guarda el nombre de usuario para autocompletar
                        // (NUNCA la contraseña — el token seguro sí se guarda)
                        if (remember) {
                            try { localStorage.setItem('azyvion_remember_user', usuario); } catch(e) {}
                        } else {
                            try { localStorage.removeItem('azyvion_remember_user'); } catch(e) {}
                        }
                        showToast('Sesión iniciada — bienvenido, ' + res.nombre, '#30d158');
                        setTimeout(function () {
                            window.location.href = 'dashboard.html';
                        }, 1300);
                    } else {
                        err.textContent = res.error || 'Error al iniciar sesión.';
                        err.classList.add('visible');
                    }
                })
                .withFailureHandler(function (e) {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    err.textContent = 'Error de conexión: ' + (e.message || 'intenta de nuevo.');
                    err.classList.add('visible');
                })
                .login(usuario, pwd, remember);
        }

        /* ---------- Pre-rellenar usuario si Recordarme estaba activo ---------- */
        (function() {
            try {
                const savedUser = localStorage.getItem('azyvion_remember_user');
                if (savedUser) {
                    document.getElementById('usuario').value = savedUser;
                    document.getElementById('remember').checked = true;
                }
                // Si ya hay sesión válida, comprobar con el backend
                const sess = JSON.parse(localStorage.getItem('azyvion_session') || 'null');
                if (sess && sess.token) {
                    google.script.run
                        .withSuccessHandler(function(r) {
                            if (r.ok) window.location.href = 'dashboard.html';
                        })
                        .checkSession();
                }
            } catch(e) {}
        })();

        function handleForgot() {
            showToast('Contacta al administrador para restablecer tu contraseña', '#0A84FF');
        }

        function showToast(msg, color) {
            color = color || '#30d158';
            const t = document.getElementById('toast');
            t.innerHTML = `<svg viewBox="0 0 24 24" style="stroke:${color};width:18px;height:18px;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none"><polyline points="20 6 9 17 4 12"/></svg> ${msg}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        document.addEventListener('keydown', e => {if (e.key === 'Enter') handleLogin();});
    </script>
</body>

</html>
