<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Azyvion CRM</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #1a1a2e;
            --card: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.55);
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --field-bg: rgba(118, 118, 128, 0.12);
            --field-focus: rgba(10, 132, 255, 0.14);
            --accent: #0A84FF;
            --accent-dark: #0060DF;
            --danger: #FF453A;
            --divider: rgba(60, 60, 67, 0.13);
        }

        html {
            height: 100%;
        }
        body {
            min-height: 100%;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            overflow: hidden;
            position: relative;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            animation: drift linear infinite;
            pointer-events: none;
        }

        .bg-orb:nth-child(1) {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #0A84FF 0%, #005cc5 100%);
            top: -120px;
            left: -80px;
            animation-duration: 18s;
        }

        .bg-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #5e5ce6 0%, #1c1c8a 100%);
            bottom: -100px;
            right: -60px;
            animation-duration: 22s;
            animation-direction: reverse;
        }

        .bg-orb:nth-child(3) {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #30d158 0%, #1a7a35 100%);
            bottom: 100px;
            left: 60px;
            animation-duration: 28s;
            opacity: 0.3;
        }

        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(40px, 30px) scale(1.06); }
            66%  { transform: translate(-20px, 50px) scale(0.95); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            margin: 16px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 36px 28px 32px;
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            box-shadow: 0 2px 0 rgba(255, 255, 255, 0.6) inset, 0 32px 80px rgba(0, 0, 0, 0.38), 0 8px 24px rgba(0, 0, 0, 0.22);
            animation: cardIn 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @media (max-width: 380px) {
            .card { padding: 28px 20px 24px; border-radius: 24px; }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(28px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #0A84FF 0%, #005cc5 100%);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 6px 22px rgba(10, 132, 255, 0.38);
        }

        .brand-icon svg {
            width: 34px;
            height: 34px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.4px;
        }

        .brand-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 400;
        }

        .field-group {
            background: var(--field-bg);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .field {
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 56px;
            position: relative;
            transition: background .18s;
        }

        .field:first-child:not(:last-child) {
            border-bottom: 1px solid var(--divider);
        }

        .field:focus-within {
            background: var(--field-focus);
        }

        .field-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: var(--text-secondary);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            margin-right: 11px;
            transition: stroke .18s;
        }

        .field:focus-within .field-icon {
            stroke: var(--accent);
        }

        .field input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            -webkit-user-select: text;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-primary);
            caret-color: var(--accent);
        }

        .field input::placeholder {
            color: var(--text-secondary);
        }

        .field-action {
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            transition: color .18s;
        }

        .field-action:hover {
            color: var(--accent);
        }

        .field-action svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            font-weight: 500;
            min-height: 20px;
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity .22s, transform .22s;
        }

        .error-msg.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .row-aux {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            display: none;
        }

        .custom-check {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 1.5px solid var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background .15s, border-color .15s;
        }

        .checkbox-label input:checked ~ .custom-check {
            background: var(--accent);
            border-color: var(--accent);
        }

        .custom-check svg {
            width: 10px;
            height: 10px;
            stroke: #fff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            opacity: 0;
            transition: opacity .15s;
        }

        .checkbox-label input:checked ~ .custom-check svg {
            opacity: 1;
        }

        .link {
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: 13.5px;
            color: var(--accent);
            cursor: pointer;
            font-weight: 500;
        }

        .link:hover {
            color: var(--accent-dark);
        }

        .btn-primary {
            width: 100%;
            height: 56px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background .2s;
            margin-bottom: 20px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-primary:active:not(:disabled) {
            background: var(--accent-dark);
            transform: scale(0.98);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-dark);
        }

        .btn-primary:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .btn-text {
            transition: opacity .2s;
        }

        .spinner {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .spinner::after {
            content: '';
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg) }
        }

        .btn-primary.loading .btn-text {
            opacity: 0;
        }

        .btn-primary.loading .spinner {
            display: flex;
        }

        .footer-text {
            text-align: center;
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .toast {
            position: fixed;
            bottom: calc(28px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: rgba(30, 30, 30, 0.92);
            color: #fff;
            padding: 13px 22px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            transition: transform .38s cubic-bezier(0.34, 1.42, 0.64, 1);
            white-space: nowrap;
            max-width: calc(100vw - 32px);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        @media(prefers-reduced-motion:reduce) {
            .bg-orb, .card { animation: none; }
        }

        * { -webkit-tap-highlight-color: transparent; }
        button, a, label { touch-action: manipulation; }
        .checkbox-label { min-height: 44px; }
        .link { min-height: 44px; display: flex; align-items: center; }
        .row-aux { align-items: center; }
        .field-action { min-width: 44px; min-height: 44px; justify-content: center; }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --card: rgba(40, 40, 50, 0.92);
                --card-border: rgba(255, 255, 255, 0.12);
                --text-primary: #F2F2F7;
                --text-secondary: #A5A5AA;
                --field-bg: rgba(118, 118, 128, 0.2);
                --field-focus: rgba(10, 132, 255, 0.18);
                --divider: rgba(255, 255, 255, 0.08);
            }
        }
    </style>
</head>

<body>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>

    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" style="stroke:#30d158">
            <polyline points="20 6 9 17 4 12" />
        </svg>
        Sesión iniciada correctamente
    </div>

    <div class="card">
        <div class="brand">
            <div class="brand-icon">
                <img src="logo-crm.png" alt="Azyvion CRM Logo" style="width:100%;height:100%;object-fit:contain;border-radius:inherit;" onerror="this.style.display='none';this.parentElement.innerHTML='<svg viewBox=\'0 0 24 24\' style=\'width:24px;height:24px;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none\'><path d=\'M12 2L2 7l10 5 10-5-10-5z\'/><path d=\'M2 17l10 5 10-5\'/><path d=\'M2 12l10 5 10-5\'/></svg>'">
            </div>
            <div class="brand-name">Azyvion CRM</div>
            <div class="brand-sub">Technology Beyond Limits</div>
        </div>

        <div class="field-group">
            <div class="field">
                <svg class="field-icon" viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <input type="text" id="usuario" placeholder="Usuario" autocomplete="username" />
            </div>
            <div class="field">
                <svg class="field-icon" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" />
                <button class="field-action" onclick="togglePwd()" aria-label="Mostrar contraseña">
                    <svg id="eyeIcon" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="error-msg" id="errMsg">Usuario o contraseña incorrectos.</div>

        <div class="row-aux">
            <label class="checkbox-label">
                <input type="checkbox" id="remember" />
                <span class="custom-check">
                    <svg viewBox="0 0 12 12">
                        <polyline points="2 6 5 9 10 3" />
                    </svg>
                </span>
                Recordarme
            </label>
            <button class="link" onclick="handleForgot()">¿Olvidaste tu contraseña?</button>
        </div>

        <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
            <span class="btn-text">Iniciar sesión</span>
            <div class="spinner"></div>
        </button>

        <p class="footer-text">
            Al ingresar aceptas los <a class="link" href="#">Términos de uso</a> de Azyvion.
        </p>
    </div>

    <!-- ════════════════════════════════════════════════════════════
         AZYVION CRM — LOGIN via Edge Function login-crm
    ═════════════════════════════════════════════════════════════ -->
    <script>
    (function () {
        var SESSION_KEY  = 'azyvion_session';
        var REMEMBER_KEY = 'azyvion_remember_user';
        var LOGIN_URL    = 'https://dwtykzporgjjvdustjfq.supabase.co/functions/v1/login-crm';

        /* ── Verificación rápida de sesión existente ─────────────────────────────
           El dashboard requiere azyvion_session con { token, expira }.
           Si ya existe una sesión válida (token presente y no expirada),
           redirigir directamente sin llamar al backend.                          */
        (function checkExisting() {
            try {
                var raw = localStorage.getItem(SESSION_KEY);
                if (!raw) return;
                var sess = JSON.parse(raw);
                if (!sess || !sess.token) return;
                if (sess.expira && new Date(sess.expira) <= new Date()) {
                    localStorage.removeItem(SESSION_KEY);
                    return;
                }
                // Sesión todavía válida: ir directo al dashboard
                window.location.href = 'dashboard.html';
            } catch (e) {}
        })();

        /* ── Pre-rellenar usuario si Recordarme estaba activo ───────────────── */
        (function prefillUser() {
            try {
                var saved = localStorage.getItem(REMEMBER_KEY);
                if (saved) {
                    document.getElementById('usuario').value = saved;
                    document.getElementById('remember').checked = true;
                }
            } catch (e) {}
        })();

        /* ── handleLogin ─────────────────────────────────────────────────────── */
        window.handleLogin = function () {
            var usuario  = document.getElementById('usuario').value.trim();
            var pwd      = document.getElementById('password').value;
            var remember = document.getElementById('remember').checked;
            var btn      = document.getElementById('loginBtn');
            var err      = document.getElementById('errMsg');

            err.classList.remove('visible');

            if (!usuario || !pwd) {
                err.textContent = 'Ingresa tu usuario y contraseña.';
                err.classList.add('visible');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            fetch(LOGIN_URL, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ usuario: usuario, contrasena: pwd })
            })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                btn.classList.remove('loading');
                btn.disabled = false;

                if (!res.ok) {
                    err.textContent = res.error || 'Error al iniciar sesión.';
                    err.classList.add('visible');
                    return;
                }

                /* ── Recordarme: solo el nombre de usuario, nunca la contraseña */
                try {
                    if (remember) {
                        localStorage.setItem(REMEMBER_KEY, usuario);
                    } else {
                        localStorage.removeItem(REMEMBER_KEY);
                    }
                } catch (e) {}

                /* ── Construir objeto de sesión compatible con dashboard.html ───
                   El dashboard verifica:
                     sess.token   → debe existir (usamos access_token de Supabase Auth)
                     sess.expira  → ISO string; si <= now() la sesión es inválida
                     sess.rol     → string 'Admin' | 'Gerente' | 'Agente'
                     sess.nombre  → string con el nombre visible
                     sess.usuario → string con el username
                   Campos adicionales que el dashboard consume si están presentes:
                     sess.fotoUrl, sess.preferencias                              */
                var expiresAt = res.session.expires_at;
                // expires_at de Supabase Auth es unix timestamp (segundos)
                var expira = new Date(expiresAt * 1000).toISOString();

                var sesion = {
                    token:        res.session.access_token,
                    refresh_token: res.session.refresh_token,
                    nombre:       res.nombre,
                    usuario:      res.usuario,
                    rol:          res.rol,
                    expira:       expira,
                    fotoUrl:      res.fotoUrl  || '',
                    preferencias: res.preferencias || {}
                };

                try {
                    localStorage.setItem(SESSION_KEY, JSON.stringify(sesion));
                } catch (e) {
                    err.textContent = 'No se pudo guardar la sesión. Revisa los permisos del navegador.';
                    err.classList.add('visible');
                    return;
                }

                showToast('Sesión iniciada — bienvenido, ' + res.nombre, '#30d158');
                setTimeout(function () {
                    window.location.href = 'dashboard.html';
                }, 1300);
            })
            .catch(function (e) {
                btn.classList.remove('loading');
                btn.disabled = false;
                err.textContent = 'Error de conexión: ' + (e.message || 'intenta de nuevo.');
                err.classList.add('visible');
            });
        };

        /* ── Helpers UI ──────────────────────────────────────────────────────── */
        window.handleForgot = function () {
            showToast('Contacta al administrador para restablecer tu contraseña', '#0A84FF');
        };

        function showToast(msg, color) {
            color = color || '#30d158';
            var t = document.getElementById('toast');
            t.innerHTML = '<svg viewBox="0 0 24 24" style="stroke:' + color + ';width:18px;height:18px;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none"><polyline points="20 6 9 17 4 12"/></svg> ' + msg;
            t.classList.add('show');
            setTimeout(function () { t.classList.remove('show'); }, 3000);
        }

        var pwdVisible = false;
        window.togglePwd = function () {
            pwdVisible = !pwdVisible;
            document.getElementById('password').type = pwdVisible ? 'text' : 'password';
        };

        /* ── Enter en cualquier campo dispara el login ───────────────────────── */
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') window.handleLogin();
        });

    })();
    </script>
</body>

</html>
